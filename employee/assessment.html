<!DOCTYPE html>
<html>
<head>
<title>Assessment</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

/* HEADER */
.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  background:#1e293b;
}

.timer {
  font-size:18px;
  color:#22c55e;
  font-weight:bold;
}

/* LAYOUT */
.container {
  display:flex;
  height:calc(100vh - 60px);
}

/* LEFT PANEL */
.main {
  flex:3;
  padding:25px;
}

.question-box {
  background:#1e293b;
  padding:20px;
  border-radius:10px;
}

.question-box h3 {
  margin-bottom:20px;
}

/* OPTIONS */
.option {
  display:block;
  padding:12px;
  margin-bottom:10px;
  border-radius:6px;
  background:#334155;
  cursor:pointer;
  transition:0.2s;
}

.option:hover {
  background:#475569;
}

.option input {
  margin-right:10px;
}

/* BUTTONS */
.actions {
  margin-top:20px;
}

button {
  padding:10px 15px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:500;
}

.next { background:#6366f1; color:white; }
.reviewBtn { background:#f59e0b; color:white; }
.submit { background:#22c55e; color:white; width:100%; margin-top:20px; }

/* RIGHT PANEL */
.sidebar {
  flex:1;
  background:#1e293b;
  padding:20px;
  border-left:1px solid #334155;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-top:10px;
}

.qbox {
  padding:10px;
  background:#334155;
  text-align:center;
  cursor:pointer;
  border-radius:6px;
  font-size:13px;
}

.qbox.active { background:#6366f1; }
.qbox.answered { background:#22c55e; }
.qbox.review { background:#f59e0b; }

/* LEGEND */
.legend {
  margin-top:20px;
  font-size:12px;
}

.legend div {
  margin:5px 0;
}
</style>

</head>

<body>

<div class="header">
  <h3 id="title"></h3>
  <div class="timer" id="timer"></div>
</div>

<div class="container">

  <!-- LEFT -->
  <div class="main">
    <div class="question-box">
      <div id="quiz"></div>

      <div class="actions">
        <button class="next" onclick="next()">Next</button>
        <button class="reviewBtn" onclick="markReview()">Mark Review</button>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="sidebar">
    <h3>Questions</h3>
    <div class="grid" id="grid"></div>

    <div class="legend">
      <div>🟦 Current</div>
      <div>🟩 Answered</div>
      <div>🟧 Review</div>
    </div>

    <button class="submit" onclick="submitQuiz()">Final Submit</button>
  </div>

</div>

<script>

let questions = [];
let index = 0;
let answers = {};
let review = {};
let submitted = false;
let time = 0;

const employee_id =
  localStorage.getItem("employee_id");

// ================= LOAD ASSESSMENT =================

async function loadAssessment() {

  if (!employee_id) {
    alert("Session expired. Please login again.");
    window.location.href = "/login.html";
    return;
  }

  try {

    const response =
      await fetch(
        `/api?action=get_assessment&employee_id=${employee_id}`
      );

    const data =
      await response.json();

    console.log("ASSESSMENT:", data);

    if (!data.success) {

      alert(
        data.message ||
        "No assessment assigned"
      );

      window.location.href =
        "/login.html";

      return;
    }

    document.getElementById("title")
      .innerText =
      "Assessment: " + data.topic;

    questions =
      data.questions || [];

    time =
      (data.duration || 0) * 60;

    createGrid();
    loadQ();
    startTimer();

  } catch (err) {

    console.error(err);

    alert(
      "Failed to load assessment"
    );
  }
}

// ================= TIMER =================

function startTimer() {

  const timer =
    document.getElementById("timer");

  setInterval(() => {

    if (submitted) return;

    time--;

    let m =
      Math.floor(time / 60);

    let s =
      time % 60;

    timer.innerText =
      `${m}:${s < 10 ? '0' : ''}${s}`;

    if (time <= 0) {

      alert("Time up!");

      submitQuiz();
    }

  }, 1000);
}

// ================= LOAD QUESTION =================

function loadQ() {

  if (
    !questions ||
    questions.length === 0
  ) {
    return;
  }

  let q =
    questions[index];

  document.getElementById("quiz")
    .innerHTML = `
      <h3>
        ${index + 1}.
        ${q.question}
      </h3>

      ${['A','B','C','D']
      .map(o => `
      <label class="option">

      <input
        type="radio"
        name="ans"
        value="${o}"
        ${answers[index] === o ? 'checked' : ''}>

      ${q[
        'option_' +
        o.toLowerCase()
      ]}

      </label>
      `).join('')}
    `;

  updateGrid();
}

// ================= SAVE =================

function save() {

  let selected =
    document.querySelector(
      'input[name="ans"]:checked'
    );

  if (selected) {

    answers[index] =
      selected.value;
  }
}

// ================= NEXT =================

function next() {

  save();

  if (
    index <
    questions.length - 1
  ) {

    index++;

    loadQ();
  }
}

// ================= GO =================

function go(i) {

  save();

  index = i;

  loadQ();
}

// ================= REVIEW =================

function markReview() {

  review[index] = true;

  updateGrid();
}

// ================= GRID =================

function createGrid() {

  document.getElementById("grid")
    .innerHTML = questions.map(
      (_, i) => `
      <div
        class="qbox"
        id="q${i}"
        onclick="go(${i})">

        ${i + 1}

      </div>
    `
    ).join('');
}

function updateGrid() {

  questions.forEach((_, i) => {

    const box =
      document.getElementById(
        "q" + i
      );

    if (!box) return;

    box.className =
      "qbox";

    if (i === index)
      box.classList.add(
        "active"
      );

    if (answers[i])
      box.classList.add(
        "answered"
      );

    if (review[i])
      box.classList.add(
        "review"
      );

  });
}

// ================= SUBMIT =================

async function submitQuiz() {

  if (submitted)
    return;

  submitted = true;

  save();

  try {

    const response =
      await fetch(
        "/api?action=submit",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              employee_id,

              answers,

              questions,

              time_taken: time

            })
        }
      );

    const result =
      await response.json();

    alert(
      "Score: " +
      result.score +
      "%"
    );

    localStorage.clear();

    window.location.href =
      "/login.html";

  } catch (err) {

    console.error(err);

    alert(
      "Failed to submit"
    );
  }
}

// ================= ANTI CHEAT =================

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.hidden &&
      !submitted
    ) {

      alert(
        "Tab switch detected"
      );

      submitQuiz();
    }
  }
);

window.addEventListener(
  "blur",
  () => {

    if (!submitted) {

      alert(
        "Window focus lost"
      );

      submitQuiz();
    }
  }
);

document.addEventListener(
  "contextmenu",
  e => e.preventDefault()
);

// ================= START =================

loadAssessment();

</script>

</body>
</html>
